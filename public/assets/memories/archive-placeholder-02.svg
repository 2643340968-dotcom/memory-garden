<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Archive image placeholder</title>
  <desc id="desc">A restrained abstract placeholder for a future verified historical image.</desc>
  <defs>
    <radialGradient id="bg" cx="52%" cy="42%" r="78%">
      <stop offset="0" stop-color="#40304c"/>
      <stop offset=".58" stop-color="#1c1525"/>
      <stop offset="1" stop-color="#0b0910"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.64" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#ccb5da" opacity=".18">
    <path d="M96 340V123h120v217M248 340V78h148v262M430 340V145h114v195" stroke-width="4"/>
    <path d="M72 340h496M110 174h92M264 132h116M445 196h84" stroke-width="2"/>
  </g>
  <rect width="640" height="400" filter="url(#grain)" opacity=".78"/>
  <text x="42" y="58" fill="#d7c5e2" font-family="Georgia, serif" font-size="15" letter-spacing="4" opacity=".72">ARCHIVE PLACEHOLDER</text>
  <text x="43" y="83" fill="#a18dad" font-family="sans-serif" font-size="11" letter-spacing="2" opacity=".65">VERIFIED IMAGE TO BE ADDED</text>
</svg>
