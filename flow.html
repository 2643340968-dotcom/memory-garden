<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f8f3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%233b4546'/%3E%3C/svg%3E">
  <meta name="description" content="沿着地图走进记忆花园，读一段往事，也可以留下自己的记忆。">
  <title>记忆之场 · 流动地图</title>
</head>
<body>
  <main id="edition" data-tools="cover">
    <div class="toolbar-shell">
    <button type="button" id="tools-grip" aria-controls="toolbar-panel" aria-expanded="false" aria-label="展开地图工具" hidden></button>
    <header class="masthead" id="toolbar-panel">
      <a class="home" href="./flow.html" aria-label="项目首页">
        <span class="imprint" aria-hidden="true"></span><span id="edition-name" class="sr"></span>
      </a>
      <nav id="trail" aria-label="地图位置"></nav>
      <div class="header-tools">
        <div class="actions"><button type="button" id="cover-book"></button><button type="button" id="open-map" hidden></button><button type="button" id="dismiss-chapter" hidden></button><button type="button" id="enter" hidden></button><button type="button" id="write" hidden></button><a id="back" href="#atlas" hidden></a></div>
        <div id="pages" hidden><button type="button" id="earlier">←</button><span></span><button type="button" id="later">→</button></div>
        <div class="map-tools" id="map-tools">
          <select id="level-target" aria-label="选择城市"></select>
          <button type="button" id="zoom-out" aria-label="返回上一级">↶</button>
          <button type="button" id="fit" aria-label="回到当前范围"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/><circle cx="12" cy="12" r="2.2"/></svg></button>
        </div>
      </div>
      <details id="guide" class="guide">
        <summary id="guide-toggle" aria-label="地图导览">?</summary>
        <div class="guide-page"><p id="guide-tip"></p>
          <div class="legend-row"><div id="legend" class="legend" aria-label="图例"></div>
            <div class="north" aria-hidden="true"><span>北</span><i></i></div></div>
          <button type="button" id="open-flower-book"></button>
          <button type="button" id="replay"></button>
          <div class="guide-meta">
            <div class="reading"><i aria-hidden="true"></i><span id="readout"></span><span id="coordinates" dir="ltr"></span></div>
            <details class="credits"><summary id="credit-title"></summary><div>
              <a id="natural-credit" href="https://www.naturalearthdata.com/" target="_blank" rel="noreferrer">自然地球地图数据 ↗</a>
              <a id="free-credit" href="https://openfreemap.org/" target="_blank" rel="noreferrer">开放自由地图 ↗</a>
              <a id="street-credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© 开放街图贡献者 ↗</a>
            </div></details>
          </div>
        </div>
      </details>
      <button class="language" id="flow-language" type="button">英文</button>
    </header>
    </div>
    <section id="stage" class="stage" data-surface="atlas">
      <div id="map" class="map" role="group" aria-label="地图" tabindex="-1">
        <canvas id="surround" aria-hidden="true"></canvas><canvas id="base" aria-hidden="true"></canvas><canvas id="notations" aria-hidden="true"></canvas>
        <canvas id="waves" aria-hidden="true"></canvas><div id="pins"></div>
      </div>
      <div id="garden" class="garden" hidden role="group" aria-label="记忆花园" tabindex="-1">
        <canvas id="waterbed" aria-hidden="true"></canvas><div id="seeds"></div>
      </div>
      <div id="nearby" role="group" aria-label="附近地点" hidden></div>
      <section id="landing" hidden aria-labelledby="landing-title">
        <div class="landing-wash" aria-hidden="true"></div>
        <canvas id="landing-flowers" aria-hidden="true"></canvas>
        <div id="landing-scroll" role="region" tabindex="0" aria-describedby="landing-hint">
          <div class="scroll-distance"><div class="landing-type">
            <h1 id="landing-title">记忆之场</h1>
            <p id="landing-intro">沿着地图走进记忆花园，读一段往事，也可以留下自己的记忆。</p>
            <button type="button" class="landing-cue" id="landing-cue">
              <span id="landing-hint">下滑进入地图</span>
              <svg viewBox="0 0 48 30" width="46" height="29" aria-hidden="true">
                <defs><linearGradient id="petal-tip" x2=".8" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ba93b5"/><stop offset=".55" stop-color="#e9b4b7"/><stop offset="1" stop-color="#d8a66d"/></linearGradient></defs>
                <path d="M6 4C16 3 23 8 24 19C16 17 9 12 6 4Z" fill="url(#petal-tip)"/>
                <path d="M42 4C32 3 25 8 24 19C32 17 39 12 42 4Z" fill="#a9c9b5"/>
                <path d="M12 8Q21 13 24 22Q27 14 36 8" fill="none" stroke="#686952" stroke-width="1.1" stroke-linecap="round"/>
                <path d="M24 21Q24.7 24 27 24.5Q24.7 25.3 24 28Q23.3 25.3 21 24.5Q23.3 24 24 21Z" fill="#cb9a6c"/>
              </svg>
            </button>
          </div></div>
        </div>
      </section>
      <div class="heading" id="chapter">
        <p id="folio"></p><h2 id="title" tabindex="-1"></h2><p id="intro"></p>
      </div>
      <p id="notice" class="notice" role="status"></p>
    </section>
    <section id="arrival" hidden aria-labelledby="arrival-title">
      <img id="arrival-flower" alt="" width="200" height="200"><p id="arrival-place"></p>
      <h2 id="arrival-title" tabindex="-1"></h2><p id="arrival-note"></p><button type="button" id="skip"></button><button type="button" id="arrival-back" hidden></button>
    </section>
  </main>
  <dialog id="flower-book" aria-labelledby="flower-book-title">
    <header class="book-head">
      <h2 id="flower-book-title"></h2>
      <button type="button" id="book-language" class="language"></button>
      <button type="button" id="close-book" class="close" autofocus>×</button>
    </header>
    <div id="book-grid" class="book-grid"></div>
  </dialog>
  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-top"><span id="sheet-place"></span><button type="button" id="sheet-language" class="language">英文</button><button type="button" id="close-sheet" class="close" aria-label="关闭">×</button></div>
    <form id="memory-form">
      <div id="memory-editor">
        <h2 id="sheet-title"></h2><p id="writing-prompt" class="sr"></p>
        <label for="memory-text" class="sr" data-i18n="entry.inputLabel">记忆文字</label>
        <textarea id="memory-text" maxlength="180" rows="3" dir="auto" aria-describedby="writing-prompt" data-i18n-placeholder="entry.placeholder"></textarea>
        <div class="attachment-heading"><b id="memory-attachment-verb"></b><span data-i18n="attachment.hint"></span></div>
        <div class="file-choices">
          <button type="button" data-attach="image"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="3"/><path d="m4 14 4-5 3 3 2-2 3 4"/><circle cx="13.5" cy="7" r="1"/></svg><span data-i18n="attachment.image"></span></button>
          <button type="button" data-attach="audio"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8v4m3-7v10m4-13v16m4-13v10m3-7v4"/></svg><span data-i18n="attachment.audio"></span></button>
          <button type="button" data-attach="video"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="3"/><path d="m8 7 5 3-5 3Z"/></svg><span data-i18n="attachment.video"></span></button>
          <input id="memory-file" type="file" hidden>
        </div><p id="memory-file-status" role="status"></p>
      </div>
      <div id="memory-reader" hidden><h2 id="memory-reader-title" data-i18n="memory.your"></h2><p id="memory-reader-text" dir="auto"></p></div>
      <figure id="memory-attachment-preview" hidden><figcaption><span id="memory-file-name" dir="auto"></span><button type="button" id="memory-remove-file" data-i18n="attachment.remove"></button></figcaption><div id="memory-preview-stage"></div></figure>
      <div id="memory-composer-footer"><p id="session-note" data-i18n="entry.descriptionLine2"></p>
        <button id="save" class="primary" type="submit" disabled></button>
        <details id="memory-visit" hidden><summary id="memory-visit-label"></summary><ul id="memory-visit-list"></ul></details>
      </div><button type="button" id="memory-reader-back" data-i18n="attachment.back" hidden></button>
    </form>
    <article id="record" hidden><h2 id="record-title"></h2><p id="record-text"></p><div id="record-media"></div><a id="record-source" target="_blank" rel="noreferrer" hidden></a></article>
  </dialog>
  <script type="module" src="/src/flow/main.js"></script>
</body>
</html>
