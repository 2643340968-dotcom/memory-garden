<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Three.js PNG flower-card version of the Zijincao field."
    />
    <meta name="theme-color" content="#2b2335" />
    <title>记忆之场 · Memory Blooms</title>
  </head>
  <body class="png-page">
    <main id="app" aria-label="记忆花园互动花田">
      <canvas id="scene" aria-label="可拖动种花的 Three.js 花田"></canvas>

      <div class="interface" aria-live="polite">
        <header class="brand-block">
          <p class="eyebrow">INTERACTIVE MEMORY GARDEN</p>
          <h1>记忆之场</h1>
          <p class="subtitle">MEMORY BLOOMS</p>
        </header>

        <div class="system-status" aria-label="系统状态">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="input-state">FLOWER ASSET · LOADING</span>
        </div>

        <section class="planting-guide">
          <p class="guide-main">按住鼠标，拖出一条花径</p>
          <p class="guide-sub">HOLD + DRAG TO PLANT FLOWERS</p>
          <span class="guide-line" aria-hidden="true"></span>
        </section>

        <aside class="field-meta" aria-label="记忆花园数据">
          <div>
            <span class="meta-label">MEMORIES</span>
            <strong id="flower-count">00000</strong>
          </div>
          <div>
            <span class="meta-label">RENDER</span>
            <strong>INSTANCED</strong>
          </div>
          <div>
            <span class="meta-label">ASSET</span>
            <strong id="asset-mode">LOADING</strong>
          </div>
        </aside>

        <button id="reset-button" class="reset-button" type="button">
          <span aria-hidden="true">↺</span>
          RESET FIELD
        </button>
      </div>

      <div
        id="memory-card-layer"
        class="memory-card-layer"
        aria-live="polite"
        aria-atomic="false"
      ></div>

      <section
        id="memory-entry-overlay"
        class="memory-entry-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="memory-entry-title"
      >
        <form id="memory-entry-form" class="memory-entry-panel">
          <p class="memory-entry-index">MEMORY ARCHIVE · 001</p>
          <h2 id="memory-entry-title">留下一段你想保存的记忆</h2>
          <p class="memory-entry-description">
            关于南京大屠杀、江东门，<br />
            或你与这个地点产生联系的某个瞬间。
          </p>
          <label class="sr-only" for="memory-text">写下你的记忆</label>
          <textarea
            id="memory-text"
            name="memory"
            maxlength="180"
            rows="4"
            required
            placeholder="可以是一句话、一个地点、&#10;一种声音，或第一次知道这段历史的时刻。"
          ></textarea>
          <button id="memory-submit" class="memory-submit" type="submit" disabled>
            <span>将记忆留在花园中</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>
      </section>

      <div id="fatal-error" class="fatal-error" role="alert" hidden>
        <strong>花田未能启动</strong>
        <span>请检查浏览器是否支持 WebGL，然后刷新页面。</span>
      </div>

      <noscript>这个互动花田需要启用 JavaScript。</noscript>
    </main>

    <script type="module" src="/src/png-main.js"></script>
  </body>
</html>
