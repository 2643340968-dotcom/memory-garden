<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
          content="A Three.js interactive field where dragging grows irregular patches of Zijincao flowers."
    />
    <meta name="theme-color" content="#dce8d6" />
    <title>紫金草 · Flower Trace</title>
  </head>
  <body>
    <main id="app" aria-label="紫金草互动花田">
      <canvas id="scene" aria-label="可拖动种花的 Three.js 花田"></canvas>

      <div class="interface" aria-live="polite">
        <header class="brand-block">
          <p class="eyebrow">INTERACTIVE FIELD STUDY · 01</p>
          <h1>紫金草</h1>
          <p class="subtitle">FLOWER TRACE</p>
        </header>

        <div class="system-status" aria-label="系统状态">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="input-state">FLOWER ASSET · LOADING</span>
        </div>

        <section class="planting-guide">
          <p class="guide-main">按住鼠标，拖出一条花径</p>
          <p class="guide-sub">HOLD + DRAG TO PLANT FLOWERS</p>
          <span class="guide-line" aria-hidden="true"></span>
        </section>

        <aside class="field-meta" aria-label="花田数据">
          <div>
            <span class="meta-label">FLOWERS</span>
            <strong id="flower-count">00000 / 20000</strong>
          </div>
          <div>
            <span class="meta-label">RENDER</span>
            <strong>INSTANCED</strong>
          </div>
          <div>
            <span class="meta-label">ASSET</span>
            <strong id="asset-mode">LOADING</strong>
          </div>
        </aside>

        <button id="reset-button" class="reset-button" type="button">
          <span aria-hidden="true">↺</span>
          RESET FIELD
        </button>
      </div>

      <div id="fatal-error" class="fatal-error" role="alert" hidden>
        <strong>花田未能启动</strong>
        <span>请检查浏览器是否支持 WebGL，然后刷新页面。</span>
      </div>

      <noscript>这个互动花田需要启用 JavaScript。</noscript>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
